services:
  postgres:
    image: postgres:16-alpine
    container_name: valhalla_postgres
    restart: always
    environment:
      POSTGRES_USER: valhalla_user
      POSTGRES_PASSWORD: valhalla_password
      POSTGRES_DB: valhalla_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - valhalla_network

  redis:
    image: redis:7-alpine
    container_name: valhalla_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - valhalla_network

volumes:
  postgres_data:
  redis_data:

networks:
  valhalla_network:
    driver: bridge